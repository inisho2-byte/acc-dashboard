[project]
name = "acc-dashboard"
version = "0.1.0"
description = "ARETE Command Center — Unified Agent Dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "gunicorn>=22.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "pydantic>=2.0",
    "sse-starlette>=2.2",
    "slowapi>=0.1.9",
    "python-json-logger>=2.0",
    "croniter>=1.3",
    "cachetools>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
